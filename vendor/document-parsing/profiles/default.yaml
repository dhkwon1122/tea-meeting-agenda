# 사내 보고서 기본 서식
#
# 값을 고치면 코드 수정 없이 바로 반영됩니다. 단위는 붙여 씁니다("14pt", "25mm", "145%").
# 변환할 때 일부만 바꾸고 싶으면 프로파일을 고치는 대신 CLI 옵션을 쓰세요.
#   doc2report convert 문서.md -o out.docx --ask
#   doc2report convert 문서.md -o out.docx --font "맑은 고딕" --size 12pt --line-spacing 1.5

name: default
description: 사내 보고서 표준 서식 (A4 세로, 바탕체 14pt)
label: 보고서                # 웹 화면 서식 선택 이름
preset_order: 1

page:
  size: A4
  orientation: portrait
  margin:
    top: 25mm
    bottom: 25mm
    left: 20mm
    right: 20mm
    header: 12mm
    footer: 10mm

fonts:
  # body 는 모든 서식의 상속 기준이라 eastAsia / ascii / size 가 반드시 필요합니다.
  body:
    eastAsia: 바탕체
    ascii: 바탕체
    size: 14pt
    color: "000000"
    line_spacing: 145%     # 배수 1.4~1.5
    space_before: 0pt
    space_after: 0pt
    align: left            # 문단은 왼쪽 맞춤 (양쪽 맞춤은 both)

  # 제목 — 최상단 가운데, 굵게, 밑줄
  title:
    size: 20pt
    bold: true
    underline: true
    align: center
    space_before: 0pt
    space_after: 10pt
    line_spacing: 130%

  # 날짜 — 제목 바로 아래, 오른쪽 정렬 (문서 첫 줄이 "2026. 10. 1" 형태면 자동 인식)
  date:
    size: 14pt
    align: right
    space_before: 0pt
    space_after: 9pt        # 6~12pt 범위
    line_spacing: 130%

  # 마크다운의 ##, ### 은 별도 제목 스타일 없이 본문 단계로 흡수되지만,
  # 필요하면 아래 값을 살려 쓰면 됩니다.
  heading1:
    size: 15pt
    bold: true
    space_before: 12pt
    space_after: 6pt
    align: left
    keep_next: true

  heading2:
    size: 14pt
    bold: true
    space_before: 9pt
    space_after: 6pt
    align: left
    keep_next: true

  heading3:
    size: 14pt
    bold: true
    space_before: 6pt
    space_after: 3pt
    align: left
    keep_next: true

  table:
    size: 12pt
    line_spacing: 100%      # 셀 안은 1배수
    space_before: 0pt
    space_after: 0pt
    align: center           # 셀 내용 가운데 정렬

  table_header:
    inherit: table          # 크기·줄간격은 table에서 물려받고 아래 것만 덮어씀
    bold: true
    align: center

  # 표 바로 아래 주석 — "* 측정 기준은 ..." (tables.note_marker 로 시작)
  table_note:
    size: 10pt
    line_spacing: 115%
    align: left
    space_before: 3pt
    space_after: 0pt

  caption:
    size: 12pt
    bold: true
    align: center
    space_before: 3pt
    space_after: 3pt

  code:
    eastAsia: D2Coding
    ascii: Consolas
    size: 11pt
    line_spacing: 115%
    align: left
    space_before: 3pt
    space_after: 3pt

  callout:
    size: 14pt
    indent: 5mm
    align: left

# 단락 체계: 1. → □(0.4cm 들여쓰기) → -(0.8cm 들여쓰기)
#   indent  : 말머리가 시작되는 왼쪽 들여쓰기
#   hanging : 말머리 뒤 본문이 걸리는 위치 (둘째 줄부터 정렬됨)
#   bold    : 그 단계 문장 전체를 굵게
#   space_after_level_change : 다음 항목의 단계가 바뀔 때(1.→□, □→- 또는 표) 단락 뒤 간격
#   space_after_level_change_max : 지면에 여유가 있을 때 늘릴 값 (지정 안 하면 늘리지 않음)
#   space_before : 하위 단계가 끝나고 이 단계가 다시 시작될 때 앞에 주는 간격
#                  (- 로 끝난 뒤 2. 가 시작되는 자리를 확실히 끊어 준다)
numbering:
  - marker: "{n}."
    indent: 0mm
    hanging: 7mm
    bold: true
    space_before: 14pt
    space_after: 0pt
    space_after_level_change: 6pt

  - marker: "□"
    ordered_marker: "□"
    aliases: ["■", "◻", "ㅁ"]   # 원문 말머리를 그대로 쓸 때 이 단계로 보는 문자
    indent: 4mm
    hanging: 6mm
    bold: true
    space_before: 3pt
    space_after: 0pt
    space_after_level_change: 6pt

  - marker: "-"
    ordered_marker: "-"
    aliases: ["–", "—"]
    indent: 8mm
    hanging: 5mm
    space_after: 0pt
    space_after_level_change: 6pt

  - marker: "·"
    ordered_marker: "·"
    aliases: ["ㆍ", "ᆞ", "‧", "∙", "•", "."]
    indent: 12mm
    hanging: 5mm
    space_after: 0pt
    space_after_level_change: 6pt

tables:
  header_shading: "F2F2F2"  # R242,G242,B242 옅은 회색 (2026-09-29 사용자 확정)
  border_width: 0.5pt
  border_color: "000000"
  cell_margin_x: 1.4mm      # 셀 좌우 안쪽 여백
  cell_margin_x_min: 0.6mm  # 폭이 모자랄 때 여기까지 줄임
  cell_margin_y: 0.4mm
  font_ladder: [12pt, 11pt, 10pt, 9pt]  # 글자가 많으면 이 범위 안에서 줄임 (9pt가 최저,
                                        # 2026-09-29 사용자 확정 — 그 아래로는 안 내림)
  char_scale_ladder: [100%]       # 장평은 줄이지 않고 글자 크기만 줄인다 (2026-09-29 사용자: 90%도 95%도
                                  # 보기 안 좋다 — 100%로 두고 9pt까지 크기만). 장평을 쓰려면 [100%, 95%]
  max_cell_lines: 3         # 한 셀이 이보다 많이 줄바꿈되면 글자 폭을 한 단계 줄임
                            # (2026-09-29: 내용 많은 셀은 3줄부터 줄이기 시작하도록 낮춤)
  max_font_spread: 2pt      # 표 전체 크기와 유난히 바쁜 셀 크기의 차이가 이보다 크면
                            # 표 전체를 낮춘다 (2026-09-29 사용자 요청: 12·9pt 섞으면
                            # 불균형해 보이니 11·9pt 정도로)
  max_header_lines: 2       # 열 폭은 내용이 정하고, 머리가 이보다 길면 머리 문구를 축약
                            # (규칙은 rules/abbreviations.yaml)
  note_markers: ["*", "※", "주)", "주:"]  # 표 바로 아래 이렇게 시작하는 문단·인용문은 표 주석
  note_marker: "*"          # 표 주석은 이 기호로 통일 (서식은 fonts.table_note)
  cell_list_markers: ["-", "·"]   # 표 셀 안 목록 항목의 말머리(깊이순; 원문 말머리가 있으면 그것)
  safety_margin: 3%         # 폰트 메트릭 오차 대비 여유
  repeat_header: true       # 표가 페이지를 넘으면 머리행 반복
  keep_row_together: true   # 행 중간 잘림 방지
  allow_landscape: false    # 그래도 안 들어가면 가로 페이지로 전환할지
  align: right              # 표 전체 위치는 오른쪽 (2026-09-29 사용자). 셀 안 글자 정렬은 fonts.table
  valign: center
  width_ratio: 1.0
  space_after: 18pt         # 표 바로 다음 문단이 표에 붙지 않도록 확보하는 앞 간격
  row_height: 7mm           # 행 최소 높이 (내용이 많으면 알아서 더 늘어남)
  row_height_relaxed: 10mm  # 지면에 여유가 있을 때의 행 최소 높이

text:
  gaechosik: true           # 개조식(명사형 종결) 변환
  noun_ending: true         # 가능하면 명사로 끝냄: "인덱스를 재설계하였습니다" → "인덱스 재설계"
  split_long_sentences: true
  max_sentence_chars: 60    # 긴 문장은 이 길이 위에서 자르고, 짧은 항목은 이 길이 안에서 합친다
  merge_short_items: true   # 같은 단계의 짧은 항목끼리 "및"으로 병합
  rules: [endings, notation]
  keep_original_in_tables: true
  date_format: "{y}. {m}. {d}"   # 2026. 10. 1
  headings_as_levels: true       # ##/### 제목도 1./□ 체계로 흡수
                                 # (제목 스타일을 따로 쓰려면 false)
  normalize_levels: true         # 문서에서 가장 바깥 단계를 0cm(1.)로 — h3부터 시작해도 첫 문장이 들여쓰이지 않게
                                 # (2026-09-29 사용자: 첫 문장 0cm, 아래 단계 0.4cm, 그 아래 0.8cm)
  leading_markers: ["□", "■", "◻", "ㅁ", "○", "●", "◦", "◆", "◇", "▶", "▷", "►", "※",
                    "-", "–", "—", "·", "ㆍ", "ᆞ", "‧", "∙", "•", ".",
                    "①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩",
                    "⑪", "⑫", "⑬", "⑭", "⑮", "⑯", "⑰", "⑱", "⑲", "⑳"]
    # 원문에 문자로 쳐 둔 말머리. "1." "1)" "(1)" "가." 같은 번호는 여기 없어도 알아본다.
    # "-", "." 처럼 ASCII 기호는 뒤에 공백이 있을 때만(음수·소수 오인 방지), 나머지는
    # "ㆍ입사예정"처럼 붙여 써도 말머리로 본다. 가운뎃점은 겉보기가 같아도 코드가 여럿
    # (U+00B7 ·, U+318D ㆍ, U+119E ᆞ 등)이라 모두 넣었다.
  keep_leading_markers: true
    # 2026-09-29 사용자 원칙: 문서에 이미 쓴 글머리 기호(1. 1) □ - · ① ※ 등)는 바꾸지 말고
    # 그대로 쓴다. 프로파일 말머리는 원문에 말머리가 없는 항목에만 붙는다.
  plain_paragraph_level: 1  # 제목·말머리가 전혀 없는 메모는 문단마다 □ 말머리 (auto_markers가 켜져 있을 때)
  auto_markers: true        # 원문에 말머리가 없는 제목·문단에 1. □ - 를 붙임 (false면 안 붙임 — confluence)
  note_marks: ["※"]
  note_indent: 4mm          # ※ 문단은 윗줄 문단보다 0.4cm 더 들여씀
  page_title_strip:               # 불러온 문서 제목 앞의 "(첨부 1)" "[첨부2]" "첨부 3." 같은 번호표는 뗌
    - '^\s*[\(\[<【〈［（]\s*첨부\s*[0-9#]*\s*[\)\]>】〉］）]\s*[.:·\-]?\s*'
    - '^\s*첨부\s*[0-9]+\s*[.:)\-]\s*'
  no_marker_openers: ["[", "［", "【", "〔", "〈", "《", "「", "『"]   # 이 꺾쇠로 시작하면 □/- 말머리를 안 붙임
  note_size_delta: 2pt      # ※ 참고사항은 본문보다 2pt 작게 (본문 14pt면 12pt, 12pt면 10pt)
  table_captions: true
    # 표 바로 위 "【사업현황】" 같은 꺾쇠 제목은 Table.caption으로 옮겨 꺾쇠·정렬 그대로
    # 렌더링한다 — 안 옮기면 "- 【사업현황】"처럼 말머리가 붙는다(2026-09-29 사용자 요청).

# --ask 로 변환 전에 물어볼 때 보여 줄 선택지 (직접 입력도 가능)
choices:
  font: [바탕체, 맑은 고딕]
  size: [14pt, 13pt, 12pt, 11pt]
  line_spacing: ["1.4", "1.45", "1.5", "1.6"]
  title_size: [20pt, 18pt, 16pt]
  body_scale: ["100%", "95%", "90%"]
  table_scale: ["100%", "95%", "90%", "80%"]
  table_size: [12pt, 11pt, 10pt, 9pt]

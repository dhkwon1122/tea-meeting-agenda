# 개조식 어미 변환 규칙 — 코드 수정 없이 여기만 고치면 됩니다.
#
# suffix_rules : 문장 끝이 왼쪽과 같으면 오른쪽으로 바꿉니다. 위에서부터 먼저 걸리는 규칙이 이깁니다.
#                (긴 것을 위에 두세요. "하였습니다"가 "습니다"보다 위에 있어야 합니다.)
# nominalize   : suffix_rules에 없으면, 이 어미들을 떼고 어간에 ㅁ/음을 붙입니다.
#                예) 진행하 → 진행함, 확인되 → 확인됨, 먹 → 먹음, 만들 → 만듦
# keep_as_is   : 이 말로 끝나면 건드리지 않습니다(고유명사·인용 등).

suffix_rules:
  # 존댓말 종결
  - ["하였습니다", "하였음"]
  - ["했습니다", "하였음"]
  - ["드렸습니다", "드렸음"]
  - ["입니다", "임"]
  - ["아닙니다", "아님"]
  - ["습니다", "음"]
  - ["합니다", "함"]
  - ["됩니다", "됨"]
  - ["봅니다", "봄"]
  - ["옵니다", "옴"]
  - ["갑니다", "감"]
  - ["바랍니다", "바람"]
  - ["드립니다", "드림"]
  - ["주십시오", "요청함"]
  - ["주시기 바랍니다", "요청함"]
  - ["해 주세요", "요청함"]
  - ["하세요", "요청함"]

  # 평서형 종결
  - ["하였다", "하였음"]
  - ["했다", "하였음"]
  - ["한다", "함"]
  - ["된다", "됨"]
  - ["되었다", "되었음"]
  - ["됐다", "되었음"]
  - ["이다", "임"]
  - ["있다", "있음"]
  - ["없다", "없음"]
  - ["같다", "같음"]
  - ["많다", "많음"]
  - ["적다", "적음"]
  - ["높다", "높음"]
  - ["낮다", "낮음"]
  - ["크다", "큼"]
  - ["작다", "작음"]
  - ["빠르다", "빠름"]
  - ["느리다", "느림"]
  - ["쉽다", "쉬움"]
  - ["어렵다", "어려움"]
  - ["좋다", "좋음"]
  - ["나쁘다", "나쁨"]
  - ["다르다", "다름"]
  - ["필요하다", "필요함"]
  - ["가능하다", "가능함"]
  - ["예정이다", "예정임"]
  - ["계획이다", "계획임"]
  - ["보인다", "보임"]
  - ["생각된다", "판단됨"]
  - ["판단된다", "판단됨"]
  - ["예상된다", "예상됨"]
  - ["요구된다", "요구됨"]
  - ["기대된다", "기대됨"]

nominalize:
  - "하였습니다"
  - "했습니다"
  - "였습니다"
  - "았습니다"
  - "었습니다"
  - "습니다"
  - "하였다"
  - "였다"
  - "았다"
  - "었다"
  - "한다"
  - "는다"
  - "ㄴ다"

keep_as_is:
  - "등"
  - "외"
  - "님"

# ── 명사로 끝내기 (프로파일 text.noun_ending: true 일 때, 위 규칙보다 먼저 시도) ──
#
# noun_endings : [끝말, 붙일 말]. 끝말을 떼고 남은 마지막 단어가 명사(한글로 끝나는 2자 이상)일
#                때만 적용합니다. 위에서부터 먼저 걸리는 규칙이 이깁니다(긴 것을 위에).
#                  "인덱스를 재설계하였습니다"      → "인덱스 재설계"
#                  "모니터링 체계를 보강할 예정입니다" → "모니터링 체계 보강 예정"
#                  "응답 지연 문제가 지속적으로 발생하였습니다" → "응답 지연 문제 지속 발생"
#                걸리지 않으면(예: "줄였습니다") 위의 suffix_rules/nominalize 로 "~음/~함"이 됩니다.
# drop_particles : 마지막 명사 바로 앞 단어에서 떼는 조사. 받침이 맞을 때만 뗍니다
#                  (을·이는 받침 있는 말 뒤, 를·가는 받침 없는 말 뒤). "사이", "주가"처럼
#                  떼면 한 글자가 되거나 받침이 안 맞으면 조사가 아니라고 보고 그대로 둡니다.
# adverb_to_noun : 마지막 명사 바로 앞 부사를 명사로 줄입니다 ("지속적으로 발생" → "지속 발생").
noun_endings:
  - ["해야 합니다", " 필요"]
  - ["해야 함", " 필요"]
  - ["할 예정입니다", " 예정"]
  - ["할 예정임", " 예정"]
  - ["할 예정이다", " 예정"]
  - ["될 예정입니다", " 예정"]
  - ["될 예정임", " 예정"]
  - [" 중입니다", " 중"]
  - [" 중임", " 중"]
  - ["하고 있습니다", " 중"]
  - ["하고 있음", " 중"]
  - ["하였습니다", ""]
  - ["했습니다", ""]
  - ["하였음", ""]
  - ["했음", ""]
  - ["하였다", ""]
  - ["했다", ""]
  - ["합니다", ""]
  - ["한다", ""]
  - ["함", ""]
  - ["되었습니다", ""]
  - ["됐습니다", ""]
  - ["되었음", ""]
  - ["되었다", ""]
  - ["됩니다", ""]
  - ["된다", ""]
  - ["됨", ""]
  - ["입니다", ""]
  - ["이다", ""]
  - ["임", ""]

drop_particles: ["을", "를", "이", "가"]

adverb_to_noun: ["적으로"]

# 문장 어디에나 적용되는 치환 (구어체·군더더기 정리)
replacements:
  - ["하고 있습니다", "하고 있음"]
  - ["하고 있음.", "중임."]
  - ["인 것 같습니다", "로 판단됨"]
  - ["인 것 같음", "로 판단됨"]
  - ["할 예정입니다", "할 예정임"]
  - ["감사합니다.", ""]
  - ["수고하셨습니다.", ""]
  - ["참고 부탁드립니다.", "참고 요망"]
  - ["확인 부탁드립니다.", "확인 요망"]
  - ["   ", " "]
  - ["  ", " "]

# 긴 문장을 끊을 수 있는 연결어미 (뒤에 쉼표가 오는 경우만 후보로 봄)
connectives:
  - "하고"
  - "하며"
  - "되며"
  - "이며"
  - "이고"
  - "지만"
  - "으나"
  - "라서"
  - "따라서"

# 표기 통일 규칙 — 코드 수정 없이 여기만 고치면 됩니다.

date:
  enabled: true
  format: "{y}. {m}. {d}."   # 공문서 관례. "{y}-{m:02}-{d:02}" 처럼 바꿔도 됩니다.
  pad: false                  # true면 9월을 09월로

numbers:
  thousands_separator: true
  # 천단위 구분을 넣을 단위. 연도·버전에 쉼표가 붙는 사고를 막기 위해 단위가 있을 때만 적용합니다.
  units: ["원", "명", "건", "개", "대", "회", "시간", "일", "월", "km", "kg", "MB", "GB", "TB"]

# 지워야 할 잔재 (Confluence 매크로 찌꺼기, 편집 링크, 이모지 등)
strip_patterns:
  - "Unknown macro:\\s*\\{[^}]*\\}"
  - "\\[edit\\]"
  - "\\(edit\\)"
  - "!\\[\\]\\(\\s*\\)"
  - "[\\U0001F300-\\U0001FAFF\\u2600-\\u27BF\\uFE0F]"

# 단순 치환
replacements:
  - ["：", ": "]
  - ["，", ", "]
  - ["∼", "~"]
  - ["º", "°"]
  - [" ,", ","]
  - [" .", "."]

# 띄어쓰기 교정 (정규식 → 치환)
spacing:
  - ["\\s*및\\s*", " 및 "]
  - ["\\s*등\\s*의\\s*", " 등의 "]
  - ["\\(\\s+", "("]
  - ["\\s+\\)", ")"]
  - ["\\s{2,}", " "]

# 표 머리 축약 규칙 — 코드 수정 없이 여기만 고치면 됩니다.
#
# 표의 열 폭은 머리가 아니라 '내용'의 길이로 정합니다. 그 폭에서 머리가
# tables.max_header_lines(프로파일) 보다 많이 줄바꿈되면 아래 단계를 차례로 겹쳐 적용하고,
# 처음으로 줄 수 안에 들어오는 결과를 씁니다. 끝까지 안 들어가면 가장 짧은 결과를 씁니다.
# 어떤 머리를 어떻게 줄였는지는 --report 에 "표 머리 축약"으로 남습니다.
#
# 적용 순서: 괄호 삭제 → 군더더기 단어 삭제 → 약어 사전 → 이웃 머리와 같은 뒷부분 삭제
#            → '및' 앞만 남기기 → 띄어쓰기 삭제

drop_parenthetical: true      # "소요 예산(단위: 천원)" → "소요 예산"

drop_words:                   # 빼도 뜻이 통하는 수식어
  - 평균
  - 향후
  - 주요
  - 세부
  - 관련
  - 전체
  - 해당

replacements:                 # 사내 약어 사전 (왼쪽 → 오른쪽)
  - ["담당 부서", "담당"]
  - ["협조 부서", "협조"]
  - ["소요 예산", "예산"]
  - ["추진 일정", "일정"]
  - ["기대 효과", "효과"]
  - ["조치 계획", "조치"]

drop_shared_suffix: true      # 같은 머리행의 이웃과 뒷부분이 같으면 뗀다
                              # "개선 전 평균 응답시간" / "개선 후 평균 응답시간" → "개선 전" / "개선 후"

keep_before:                  # 이 말이 있으면 앞부분만 남긴다 ("비고 및 향후 조치 계획" → "비고")
  - " 및 "
  - "/"
  - "·"
  - ", "

remove_spaces: true           # 마지막 수단: "개선 전 응답시간" → "개선전응답시간"
